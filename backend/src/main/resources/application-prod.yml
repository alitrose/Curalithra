spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 20000

curalithra:
  security:
    jwt-secret: ${CURALITHRA_JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.curalithra.web: INFO
    org.flywaydb: INFO
