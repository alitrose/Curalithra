spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      idle-timeout: 180000
      max-lifetime: 240000
      connection-timeout: 30000
      keepalive-time: 120000

server:
  forward-headers-strategy: native

curalithra:
  security:
    jwt-secret: ${CURALITHRA_JWT_SECRET}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.curalithra.web: INFO
    org.flywaydb: INFO
