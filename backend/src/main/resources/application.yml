spring:
  application:
    name: curalithra-web-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

curalithra:
  app:
    name: CURALITHRA
    subtitle: Intelligent Hospital Management System
    edition: Horizon Edition
    tagline: Care, Connected. Operations, Simplified.
    version: 1.0.0
    timezone: ${CURALITHRA_APP_TIMEZONE:UTC}
    default-tax-rate: 0.0500
    currency-code: INR
    currency-symbol: "₹"
  security:
    jwt-secret: ${CURALITHRA_JWT_SECRET:}
    jwt-expiration-ms: ${CURALITHRA_JWT_EXPIRATION_MS:28800000}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    enabled: ${CURALITHRA_BOOTSTRAP_ENABLED:false}
    admin-name: ${CURALITHRA_BOOTSTRAP_ADMIN_NAME:Hospital Administrator}
    admin-username: ${CURALITHRA_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-email: ${CURALITHRA_BOOTSTRAP_ADMIN_EMAIL:admin@curalithra.demo}
    admin-password: ${CURALITHRA_BOOTSTRAP_ADMIN_PASSWORD:}
    seed-demo-data: ${CURALITHRA_BOOTSTRAP_SEED_DEMO:true}
