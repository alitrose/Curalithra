name: Deploy CURALITHRA Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend Vitest test suite
        run: npm test

      - name: Check production API URL variable
        shell: bash
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::warning::Repository variable VITE_API_BASE_URL is not set. Set Settings -> Secrets and variables -> Actions -> Variables -> VITE_API_BASE_URL to your Render API URL (e.g., https://curalithra-web-api.onrender.com/api)."
          fi

      - name: Build production Vite bundle for GitHub Pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Verify base path in compiled index.html
        shell: bash
        run: |
          grep -q "/Curalithra-Web/assets/" dist/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
