services:
  - type: web
    name: curalithra-api
    runtime: docker
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CURALITHRA_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CURALITHRA_DEMO_ENABLED
        value: "true"
      - key: CURALITHRA_DEMO_SEED_ON_STARTUP
        value: "true"
      - key: CURALITHRA_BOOTSTRAP_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:+UseSerialGC"
