services:
  - type: web
    name: curalithra-web-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CURALITHRA_JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CURALITHRA_BOOTSTRAP_ENABLED
        value: "false"
      - key: CURALITHRA_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
